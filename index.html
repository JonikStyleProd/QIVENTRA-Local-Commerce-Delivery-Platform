<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>QIVENTRA</title>
    <meta name="author" content="JonikStyle Production" />
    <meta name="copyright" content="© JonikStyle Production" />
    <script>
      // Set language, direction and theme before first paint; the contexts keep them in sync afterwards.
      // The language rule is the same as pickLanguage in src/i18n/detectLanguage.ts.
      try {
        var lang = localStorage.getItem('qiventra_language');
        if (lang !== 'ru' && lang !== 'en' && lang !== 'he') {
          var tags = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
          lang = 'en';
          for (var i = 0; i < tags.length; i++) {
            var code = String(tags[i]).toLowerCase().split('-')[0];
            if (code === 'iw') code = 'he';
            if (code === 'ru' || code === 'en' || code === 'he') {
              lang = code;
              break;
            }
          }
        }
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
        if (lang === 'he') document.documentElement.classList.add('rtl');
        var savedTheme = localStorage.getItem('qiventra-theme');
        if (savedTheme === 'dark' || (savedTheme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <meta name="description" content="QIVENTRA: a portfolio demo of neighborhood commerce and delivery in Tel Aviv, in Hebrew, English and Russian. No payment is taken." />
    <meta property="og:title" content="QIVENTRA — neighborhood shops and delivery (portfolio demo)" />
    <meta property="og:description" content="A portfolio demo of neighborhood commerce and delivery in Tel Aviv. No payment is taken." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- PWA & Apple Meta Tags with Official QIVENTRA Brand Mark -->
    <meta name="application-name" content="QIVENTRA" />
    <meta name="theme-color" content="#FFF8EC" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="QIVENTRA" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/qiventra-apple-touch-v3-180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/qiventra-favicon-v3-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/qiventra-icon-v3-192.png" />

    <!-- Preload the official mark so the header logo renders without a layout shift -->
    <link rel="preload" as="image" href="https://hrhjkixwsxciyxoxfciy.supabase.co/storage/v1/object/public/brand-assets/qiventra/v1/qiventra-mark-transparent-2k.png" />

    <!-- Collage fonts: Nunito + Rubik (text, Hebrew), Caveat + Amatic SC (handwriting, Hebrew) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Rubik:wght@600;700;800;900&family=Caveat:wght@600;700&family=Amatic+SC:wght@700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

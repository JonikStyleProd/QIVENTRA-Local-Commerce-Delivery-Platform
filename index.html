<!doctype html>
<html lang="ru" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>QIVENTRA</title>
    <script>
      // Set language and direction before first paint; LanguageContext keeps them in sync afterwards.
      try {
        var savedLang = localStorage.getItem('qiventra_language');
        if (savedLang === 'ru' || savedLang === 'en' || savedLang === 'he') {
          document.documentElement.lang = savedLang;
          document.documentElement.dir = savedLang === 'he' ? 'rtl' : 'ltr';
        }
      } catch (e) {}
    </script>
    <meta name="description" content="קיוונטרה: פלטפורמת מסחר שכונתית ומשלוחים מהירים בישראל. שווקים מקומיים, מעדניות, מאפיות, פארם וטכנולוגיה." />
    <meta property="og:title" content="QIVENTRA — Local Commerce & Fast Delivery Platform" />
    <meta property="og:description" content="Hyperlocal commerce and rapid delivery platform in Israel. Fresh markets, bakeries, artisan groceries, and home goods." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- PWA & Apple Meta Tags with Official QIVENTRA Brand Mark -->
    <meta name="application-name" content="QIVENTRA" />
    <meta name="theme-color" content="#FFF8EC" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="QIVENTRA" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/qiventra-apple-touch-v3-180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/qiventra-favicon-v3-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/qiventra-icon-v3-192.png" />

    <!-- Preload the official mark so the header logo renders without a layout shift -->
    <link rel="preload" as="image" href="https://hrhjkixwsxciyxoxfciy.supabase.co/storage/v1/object/public/brand-assets/qiventra/v1/qiventra-mark-transparent-2k.png" />

    <!-- Collage fonts: Nunito + Rubik (text, Hebrew), Caveat + Amatic SC (handwriting, Hebrew) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Rubik:wght@600;700;800;900&family=Caveat:wght@600;700&family=Amatic+SC:wght@700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
